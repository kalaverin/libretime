---
# Isolated test environment for API v2
# Usage: docker compose -f docker-compose.test.yml up -d
# Stop: docker compose -f docker-compose.test.yml down

services:
  postgres:
    image: postgres:15-alpine
    container_name: libretime-test-postgres
    environment:
      POSTGRES_USER: libretime
      POSTGRES_PASSWORD: libretime
      POSTGRES_DB: libretime_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libretime -d libretime_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No volumes - data is ephemeral for tests
    tmpfs:
      - /var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: libretime-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_VHOST: /libretime
      RABBITMQ_DEFAULT_USER: libretime
      RABBITMQ_DEFAULT_PASS: libretime
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI (optional)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for caching/sessions (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: libretime-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
