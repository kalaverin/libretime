[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[dependency-groups]
build = [
  "setuptools",
  "wheel"
]
development = [
  "django-coverage-plugin>=3.0.0,<4",
  "django-stubs[compatible-mypy]>=5.1.0,<6",
  "djangorestframework-stubs[compatible-mypy]>=1.8.0,<4",
  "model-bakery>=1.10.1,<2",
  "pylint-django>=2.5.3,<3",
  "pytest-django>=4.5.2,<5",
  "requests-mock>=1.10.0,<2"
]

[project]
authors = [{name = "LibreTime Contributors"}]
dependencies = [
  "django>=4.2.0,<4.3",
  "django-cors-headers>=3.14.0,<4.5",
  "django-filter>=2.4.0,<24.4",
  "djangorestframework>=3.14.0,<3.16",
  "drf-spectacular>=0.22.1,<0.29",
  "gunicorn>=22.0.0,<23.1",
  "psycopg[binary]>=3.1.8,<3.3",
  "requests>=2.32.2,<2.33",
  "sentry-sdk[django]>=1.15.0,<2",
  "uvicorn[standard]>=0.17.6,<0.36.0"
]
description = "LibreTime API"
license = {text = "AGPLv3"}
name = "api"
requires-python = ">=3.10"
version = "4.5.0"

[project.scripts]
libretime-api = "libretime_api.manage:main"

[project.urls]
"Bug Tracker" = "https://github.com/libretime/libretime/issues"
Documentation = "https://libretime.org"
Homepage = "https://github.com/libretime/libretime"
"Source Code" = "https://github.com/libretime/libretime"

[ruff.lint.isort]
known-first-party = [
  "analyzer",
  "api_client",
  "shared",
  "worker"
]
known-third-party = [
  "django",
  "django_cors_headers",
  "django_filter",
  "djangorestframework",
  "drf-spectacular",
  "gunicorn",
  "psycopg",
  "requests",
  "pydantic",
  "sentry_sdk",
  "uvicorn"
]

[tool.coverage.run]
omit = [
  "*/migrations/*",
  "*/tests/*"
]
plugins = ["django_coverage_plugin"]
source = ["api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings.testing"

[tool.setuptools]
packages = ["api"]
