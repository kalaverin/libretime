[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[dependency-groups]
build = [
  "setuptools",
  "wheel"
]
development = [
  "distro>=1.8.0,<2",
  "requests-mock>=1.10.0,<2",
  "syrupy>=4.0.0,<5",
  "types-lxml==2025.03.30",
  "types-backports>=0.1.3,<1",
  "types-python-dateutil>=2.8.1,<3",
  "types-requests>=2.31.0,<3"
]

[project]
authors = [{name = "LibreTime Contributors"}]
dependencies = [
  "backports-zoneinfo>=0.2.1,<0.3 ; python_full_version < '3.9'",
  "jinja2>=3.0.3,<3.2",
  "kombu==4.6.11",
  "lxml>=4.5.0,<6.1.0",
  "mutagen>=1.45.1,<1.48",
  "python-dateutil>=2.8.1,<2.10",
  "requests>=2.32.2,<2.33",
  "sentry-sdk>=1.15.0,<2",
  "typing-extensions>=4.15.0"
]
description = "LibreTime Playout"
license = {text = "AGPLv3"}
name = "libretime-playout"
requires-python = ">=3.10"
version = "4.5.0"

[project.scripts]
libretime-liquidsoap = "libretime_playout.liquidsoap.main:cli"
libretime-playout = "libretime_playout.main:cli"
libretime-playout-notify = "libretime_playout.notify.main:cli"

[project.urls]
"Bug Tracker" = "https://github.com/libretime/libretime/issues"
Documentation = "https://libretime.org"
Homepage = "https://github.com/libretime/libretime"
"Source Code" = "https://github.com/libretime/libretime"

[tool.mypy]
check_untyped_defs = true

[tool.setuptools.packages.find]
include = ["libretime_*"]
where = ["."]
