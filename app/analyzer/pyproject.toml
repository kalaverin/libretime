[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
development = [
  "distro>=1.8.0,<2",
  "types-requests>=2.31.0,<3"
]

[project]
authors = [{name = "LibreTime Contributors"}]
dependencies = [
  "mutagen>=1.45.1,<1.48",
  "pika>=1.0.0,<1.4",
  "requests>=2.32.2,<2.33",
  "sentry-sdk>=1.15.0,<2",
  "typing-extensions>=4.15.0"
]
description = "LibreTime Analyzer"
license = {text = "AGPLv3"}
name = "analyzer"
requires-python = ">=3.10"
version = "4.5.0"

[project.scripts]
analyzer = "analyzer.main:cli"

[project.urls]
"Bug Tracker" = "https://github.com/libretime/libretime/issues"
Documentation = "https://libretime.org"
Homepage = "https://github.com/libretime/libretime"
"Source Code" = "https://github.com/libretime/libretime"

[ruff.lint.isort]
known-first-party = [
  "api",
  "api_client",
  "shared",
  "worker"
]
known-third-party = [
  "mutagen",
  "pika",
  "requests",
  "sentry_sdk"
]

[tool.uv.build-backend]
module-name = "analyzer"
module-root = ""
