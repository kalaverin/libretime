[project]
name = "libretime-shared"
version = "4.5.0"
requires-python = ">=3.10"
description = "LibreTime Shared"
authors = [{ name = "LibreTime Contributors" }]
license = { text = "AGPLv3" }
dependencies = [
    "backports-zoneinfo>=0.2.1,<0.3 ; python_full_version < '3.9'",
    "click>=8.0.4,<8.2",
    "pydantic>=2.5.0,<2.12",
    "pyyaml>=5.3.1,<6.1",
]

[dependency-groups]
build = [
  "setuptools",
  "wheel"
]
development = [
  "types-backports>=0.1.3,<1",
  "types-pyyaml>=5.3.1,<7",
]

[project.urls]
Homepage = "https://github.com/libretime/libretime"
"Bug Tracker" = "https://github.com/libretime/libretime/issues"
Documentation = "https://libretime.org"
"Source Code" = "https://github.com/libretime/libretime"

[tool.mypy]
allow_redefinition = true
disallow_incomplete_defs= true
disallow_untyped_calls= true
disallow_untyped_defs= true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["libretime_*"]
