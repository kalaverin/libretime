[unix_http_server]
file = var/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
loglevel    = info
nodaemon    = false
silent      = false
minfds      = 1024
minprocs    = 200
directory   = %(ENV_PWD)s
logfile     = log/daemon.log
pidfile     = var/run/supervisord.pid
environment = PATH="%(ENV_PWD)s/.venv/bin:%(ENV_PATH)s",PYTHONUNBUFFERED="1"

[supervisorctl]
prompt       = >
history_file = var/run/supervisord.hist
serverurl    = unix://var/run/supervisord.sock

[program:analyzer]
process_name   = %(program_name)s
command        = .venv/bin/analyzer --log-level debug
stdout_logfile = log/%(program_name)s.log
stderr_logfile = log/errors/%(program_name)s.log
autostart      = true
autorestart    = true
startsecs      = 1
stopwaitsecs   = 3600
killasgroup    = true

[program:api]
process_name   = %(program_name)s
command        = .venv/bin/api runserver 0.0.0.0:7512
stdout_logfile = log/%(program_name)s.log
stderr_logfile = log/errors/%(program_name)s.log
autostart      = true
autorestart    = true
startsecs      = 1
stopwaitsecs   = 3600
killasgroup    = true

[program:icecast]
