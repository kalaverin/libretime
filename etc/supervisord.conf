command        = bin/icecast -c etc/icecast.xml
stdout_logfile = log/%(program_name)s.log
stderr_logfile = log/errors/%(program_name)s.log
autostart      = true
autorestart    = true
startsecs      = 1
stopwaitsecs   = 3600
killasgroup    = true

