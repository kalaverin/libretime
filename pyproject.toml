[dependency-groups]
development = [
  "async-asgi-testclient>=1.4.11",
  "bandit[toml]>=1.9.4",
  "basedmypy>=2.10.0",
  "basedpyright>=1.38.2",
  "better-exceptions>=0.3.3",
  "black>=26.1.0",
  "colorama>=0.4.6",
  "faker>=40.13.0",
  "hexora>=0.2.2",
  "model-bakery>=1.23.4",
  "pre-commit>=4.5.1",
  "psycopg-binary>=3.3.3",
  "pytest>=8.2,<9",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12.0",
  "pytest-dotenv>=0.5.2",
  "pytest-mock>=3.15.1",
  "pytest-timeout>=2.4.0",
  "python-lsp-server[all]>=1.14.0",
  "refurb>=2.3.0",
  "requests-mock>=1.12.1",
  "ruff>=0.15.4",
  "structlog>=25.5.0",
  "syrupy>=4.9.1",
  "ty>=0.0.19",
  "types-protobuf>=6.32.1.20260221",
  "typing-extensions>=4.15.0",
  "typing-inspection>=0.4.2",
  "vulture>=2.14",
  "yamlfix>=1.19.1",
  "yamllint>=1.38.0",
]

[project]
authors = [
  {name = "LibreTime Contributors"},
  {name = "Alex Kalaverin", email = "alex@kalaver.in"}
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
description = "LibreTime"
name = "libretime"
readme = "README.md"
requires-python = ">=3.10,<3.11"
version = "4.5.0"
dependencies = [
    "faker>=40.13.0",
    "orjson>=3.11.7",
    "pyotp>=2.9.0",
    "python-dateutil>=2.9.0.post0",
    "rich>=14.3.3",
    "structlog>=25.5.0",
    "supervisor>=4.3.0",
    "yacron>=0.19.0",
]

[tool.bandit]
exclude_dirs = [".venv", ".git"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "^\\s+\\.{3}"
]
show_missing = true

[tool.pylint.messages_control]
disable = [
  # "duplicate-code",
  # "fixme",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "too-few-public-methods",
  "too-many-arguments"
]
enable = "all"
extension-pkg-whitelist = [
  "lxml.etree",
  "pydantic"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings.testing"
log_cli = true
log_cli_level = "DEBUG"

[tool.refurb]
ignore = [
  184  # Assignment statement should be chained
]
mypy_args = ["--cache-fine-grained", "--show-traceback", "--config", "etc/lint/mypy.toml"]
python_version = "3.10"

[tool.ruff]
exclude = []
extend = "etc/lint/ruff.toml"

[tool.ruff.lint.isort]
detect-same-package = true
lines-between-types = 1
order-by-type = true
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-project",
  "local-folder"
]
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = [
  "S",
  "ANN",
  "DTZ",
  "INP",
  "PLR",
  "PT",
  "RUF",
  "SLF"
]

[tool.ty.rules]
possibly-missing-attribute = "ignore"

[tool.ty.src]
exclude = []

[tool.uv]
default-groups = [
  # "development"
]
index-strategy = "unsafe-best-match"
package = false

[[tool.uv.index]]
allow_insecure_host = "uv.dush.es"
authenticate = "never"
name = "private"
url = "https://uv.dush.es/root/bsd/+simple/"

[tool.uv.workspace]
members = [
  "app/*",
  "src/*"
]
